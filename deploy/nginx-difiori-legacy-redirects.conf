# DIFIORI legacy SEO redirects
#
# Apply this on the public Nginx/hosting layer that receives:
# - www.difiori.com.ec
# - mail.difiori.com.ec
# - old PHP storefront URLs such as /producto.php?id=...
#
# Keep email/webmail DNS separate if mail.difiori.com.ec is still used for actual
# webmail. If it is only serving the old storefront, redirect it permanently.

server {
  listen 80;
  listen 443 ssl http2;
  server_name www.difiori.com.ec mail.difiori.com.ec;

  return 301 https://difiori.com.ec$request_uri;
}

server {
  listen 80;
  listen 443 ssl http2;
  server_name difiori.com.ec;

  location = /producto.php {
    if ($arg_id = 2280) {
      return 301 https://difiori.com.ec/shop;
    }

    if ($arg_id = 521) {
      return 301 https://difiori.com.ec/shop;
    }

    return 301 https://difiori.com.ec/shop;
  }

  location = /product.php {
    return 301 https://difiori.com.ec/shop;
  }
}
