# DIFIORI legacy SEO redirects
#
# Apply this on the public Nginx/hosting layer that receives the listed hosts.
# A 502 on mail.difiori.com.ec happens before Express runs, so these rules must
# live in that host's Nginx/cPanel virtual-host configuration.
#
# If mail.difiori.com.ec also provides webmail, keep its webmail upstream/routes
# and use the narrowly scoped redirects below. SMTP and IMAP are unaffected.

# www always goes to the canonical host. Add the certificate directives used by
# this server in your own Nginx configuration.
server {
  listen 80;
  listen 443 ssl http2;
  server_name www.difiori.com.ec;

  return 301 https://difiori.com.ec$request_uri;
}

# This host must exist even when the old upstream application is unavailable.
# Exact locations are served by Nginx directly, so they cannot return a 502.
server {
  listen 80;
  listen 443 ssl http2;
  server_name mail.difiori.com.ec;

  location = /producto.php { return 301 https://difiori.com.ec/shop; }
  location = /product.php { return 301 https://difiori.com.ec/shop; }

  location ~ ^/(san-valentin-|navidad-2024|cumpleanos|desayunos|ofrendas|ocasiones\.php)$ {
    return 301 https://difiori.com.ec/shop;
  }

  # Preserve existing /webmail or Roundcube configuration here when mail is in
  # use. If this subdomain only hosted the old storefront, replace its remaining
  # proxy/root configuration with: return 301 https://difiori.com.ec$request_uri;
}

# Add these locations inside the existing canonical difiori.com.ec server block.
# They protect direct visits to old URLs even if a DNS/proxy change sends them
# to the new application.
server {
  listen 80;
  listen 443 ssl http2;
  server_name difiori.com.ec;

  location = /producto.php {
    return 301 https://difiori.com.ec/shop;
  }

  location = /product.php {
    return 301 https://difiori.com.ec/shop;
  }

  location ~ ^/(san-valentin-|navidad-2024|cumpleanos|desayunos|ofrendas|ocasiones\.php)$ {
    return 301 https://difiori.com.ec/shop;
  }
}
