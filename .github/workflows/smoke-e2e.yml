name: Smoke E2E

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Hourly storefront smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || secrets.SMOKE_BASE_URL || 'https://difiori.com.ec' }}
      SMOKE_TIMEOUT_MS: "15000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke E2E
        run: npm run smoke:e2e
